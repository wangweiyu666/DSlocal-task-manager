name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_android_matrix:
        description: Run unit tests on both variants (for flavor or build configuration changes)
        type: boolean
        default: false
      full_unit_suite:
        description: Run every independent unit test once (including performance)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure locale
        run: sudo locale-gen zh_CN.UTF-8

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check committed content
        run: bash scripts/ci/check-secrets.sh

      - name: Check DCO
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-dco.sh "$BASE_SHA"

      - name: Verify and build Android variants
        id: gradle_verify
        continue-on-error: true
        run: |
          unit_tests=(testProductionDebugUnitTest)
          profile=release
          if [[ "${{ inputs.full_unit_suite }}" == "true" ]]; then
            profile=full
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Features outside the core profile must regain their coverage when changed.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            : # Explicit manual profile inputs above apply without a push base.
          elif [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            profile=full
          else
            while IFS= read -r path; do
              case "$path" in
                */ui/execution/*) ;;
                app/src/*/java/*/ui/*|app/src/*/java/*/settings/*|app/src/*/java/*/sharing/*|app/src/*/java/*/history/*|app/src/*/java/*/statistics/*|app/src/main/res/*|app/build.gradle.kts|gradle/*|scripts/testing/*)
                  profile=full ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi
          if [[ "${{ inputs.full_android_matrix }}" == "true" ]]; then
            unit_tests=(testOfflineDebugUnitTest testProductionDebugUnitTest)
            profile=full
          fi
          ./gradlew "${unit_tests[@]}" \
            "-PandroidTestProfile=$profile" \
            lintOfflineRelease assembleOfflineDebug assembleOfflineDebugAndroidTest \
            lintProductionDebug assembleProductionDebug \
            --no-daemon

      - name: Verify offline Android connectivity boundary
        run: bash scripts/ci/check-connectivity-boundaries.sh

      - name: Create offline APK checksum
        working-directory: app/build/outputs/apk/offline/debug
        run: sha256sum app-offline-debug.apk > app-offline-debug.apk.sha256

      - name: Upload offline Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: DStationery-offline-debug
          path: |
            app/build/outputs/apk/offline/debug/app-offline-debug.apk
            app/build/outputs/apk/offline/debug/app-offline-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Print dependency verification report
        if: steps.gradle_verify.outcome == 'failure'
        run: |
          find build/reports/dependency-verification -type f -name dependency-verification-report.html -print -exec cat {} \; || true
          ./gradlew checkDebugAarMetadata --write-verification-metadata sha256 --no-daemon || true
          git diff -- gradle/verification-metadata.xml
          git restore -- gradle/verification-metadata.xml

      - name: Check clean generated state
        run: git diff --check && test -z "$(git status --porcelain)"

      - name: Enforce Gradle verification result
        if: always()
        run: test "${{ steps.gradle_verify.outcome }}" = success

  screenshots:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TZ: Asia/Hong_Kong
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Hong_Kong -Duser.language=zh -Duser.country=CN -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Shorten Windows build paths
        shell: pwsh
        run: |
          subst W: "$env:GITHUB_WORKSPACE"
          subst G: "$env:GRADLE_USER_HOME"
          "GRADLE_USER_HOME=G:\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Windows screenshot baselines
        run: W:\gradlew.bat -p W:\ -I W:\scripts\testing\android-screenshot-matrix.init.gradle validateOfflineDebugScreenshotTest validateProductionDebugScreenshotTest --no-daemon
