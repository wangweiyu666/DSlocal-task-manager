name: Android CI

on:
  push:
    branches: [main]
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", "gradlew*", "shared/**", "protocol-test-vectors/**", "docs/dst1-schema.json", "scripts/testing/**", "scripts/ci/check-secrets.sh", "scripts/ci/check-dco.sh", "scripts/ci/check-connectivity-boundaries.sh", "scripts/ci/select-android-profile.sh", ".github/workflows/android-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", "gradlew*", "shared/**", "protocol-test-vectors/**", "docs/dst1-schema.json", "scripts/testing/**", "scripts/ci/check-secrets.sh", "scripts/ci/check-dco.sh", "scripts/ci/check-connectivity-boundaries.sh", "scripts/ci/select-android-profile.sh", ".github/workflows/android-ci.yml"]
  workflow_dispatch:
    inputs:
      full_android_matrix:
        description: Diagnose a production screenshot/manual failure on both variants
        type: boolean
        default: false
      full_unit_suite:
        description: Diagnose a production screenshot/manual failure with all unit tests
        type: boolean
        default: false
      diagnostic_reason:
        description: Production screenshot or manual acceptance failure being investigated
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure locale
        run: sudo locale-gen zh_CN.UTF-8

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check committed content
        run: bash scripts/ci/check-secrets.sh

      - name: Check DCO
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-dco.sh "$BASE_SHA"

      - name: Verify and build Android variants
        id: gradle_verify
        continue-on-error: true
        env:
          FULL_UNIT_SUITE: ${{ inputs.full_unit_suite }}
          FULL_ANDROID_MATRIX: ${{ inputs.full_android_matrix }}
          DIAGNOSTIC_REASON: ${{ inputs.diagnostic_reason }}
        run: bash scripts/ci/select-android-profile.sh

      - name: Verify offline Android connectivity boundary
        run: bash scripts/ci/check-connectivity-boundaries.sh

      - name: Create Debug APK checksums
        run: |
          for variant in offline production; do
            (cd "app/build/outputs/apk/$variant/debug" && sha256sum "app-$variant-debug.apk" > "app-$variant-debug.apk.sha256")
          done

      - name: Upload both Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DStationery-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/offline/debug/app-offline-debug.apk
            app/build/outputs/apk/offline/debug/app-offline-debug.apk.sha256
            app/build/outputs/apk/production/debug/app-production-debug.apk
            app/build/outputs/apk/production/debug/app-production-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/
            build/reports/dependency-verification/
          if-no-files-found: warn
          retention-days: 14

      - name: Check clean generated state
        run: git diff --check && test -z "$(git status --porcelain)"

      - name: Enforce Gradle verification result
        if: always()
        run: test "${{ steps.gradle_verify.outcome }}" = success

  screenshots:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TZ: Asia/Hong_Kong
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Hong_Kong -Duser.language=zh -Duser.country=CN -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Shorten Windows build paths
        shell: pwsh
        run: |
          subst W: "$env:GITHUB_WORKSPACE"
          subst G: "$env:GRADLE_USER_HOME"
          "GRADLE_USER_HOME=G:\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate production screenshot baselines
        run: W:\gradlew.bat -p W:\ -I W:\scripts\testing\android-screenshot-matrix.init.gradle validateProductionDebugScreenshotTest --no-daemon
      - name: Diagnose offline screenshots
        if: inputs.full_android_matrix && inputs.diagnostic_reason != ''
        run: W:\gradlew.bat -p W:\ -I W:\scripts\testing\android-screenshot-matrix.init.gradle validateOfflineDebugScreenshotTest --no-daemon
      - name: Upload screenshot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-${{ github.sha }}
          path: app/build/reports/screenshotTest/
          if-no-files-found: warn
          retention-days: 14
