name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure locale
        run: sudo locale-gen zh_CN.UTF-8

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check committed content
        run: bash scripts/ci/check-secrets.sh

      - name: Check DCO
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/check-dco.sh "$BASE_SHA"

      - name: JVM lint and debug artifacts
        id: gradle_verify
        continue-on-error: true
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Print dependency verification report
        if: steps.gradle_verify.outcome == 'failure'
        run: |
          find build/reports/dependency-verification -type f -name dependency-verification-report.html -print -exec cat {} \; || true
          ./gradlew checkDebugAarMetadata --write-verification-metadata sha256 --no-daemon || true
          git diff -- gradle/verification-metadata.xml
          git restore -- gradle/verification-metadata.xml

      - name: Check clean generated state
        run: git diff --check && test -z "$(git status --porcelain)"

      - name: Enforce Gradle verification result
        if: always()
        run: test "${{ steps.gradle_verify.outcome }}" = success

  screenshots:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Windows screenshot baselines
        run: .\gradlew.bat validateDebugScreenshotTest --no-daemon
