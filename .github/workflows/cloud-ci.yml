name: Cloud Phase 3

on:
  push:
    branches: [main]
    paths: ["cloud/**", "cloud-web/**", "cloud-protocol-test-vectors/**", "web/**", ".github/workflows/cloud-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["cloud/**", "cloud-web/**", "cloud-protocol-test-vectors/**", "web/**", ".github/workflows/cloud-ci.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: verify
        options: [verify, staging, production]

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloud/package-lock.json
            cloud-web/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: cloud
      - run: npm run check
        working-directory: cloud
      - run: npm run migrate:local
        working-directory: cloud
      - name: Exercise the local HTTP sync contract
        working-directory: cloud
        shell: bash
        run: |
          npm run dev -- \
            --var AUTH_PEPPER:ci-local-smoke-pepper \
            --var ADMIN_EMAIL:admin@example.com \
            --var RESEND_API_KEY:unused-in-local-mode \
            > "$RUNNER_TEMP/dstationery-cloud.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8787/health >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/dstationery-cloud.log"
              exit 1
            fi
            sleep 1
          done
          npm run smoke:local
      - run: npm ci
        working-directory: cloud-web
      - run: npm run typecheck
        working-directory: cloud-web
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build:all
        working-directory: web

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    needs: verify
    runs-on: ubuntu-24.04
    environment: cloud-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloud/package-lock.json }
      - run: npm ci
        working-directory: cloud
      - name: Guard environment isolation
        run: node scripts/guard-environment.mjs staging
        working-directory: cloud
      - name: Apply staging migrations by database name
        run: npx wrangler d1 migrations apply dstationery-staging --remote --env staging
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply staging deletion-ledger migrations by database name
        run: npx wrangler d1 migrations apply dstationery-deletion-ledger-staging --remote --env staging
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env staging
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
        working-directory: web
      - run: npm run build:connected
        working-directory: web
      - run: npm ci
        working-directory: cloud-web
      - run: npx wrangler deploy --env staging
        working-directory: cloud-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: verify
    runs-on: ubuntu-24.04
    environment: cloud-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloud/package-lock.json }
      - run: npm ci
        working-directory: cloud
      - run: node scripts/guard-environment.mjs production
        working-directory: cloud
      - name: Apply production migrations by database name
        run: npx wrangler d1 migrations apply dstationery-production --remote --env production
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply production deletion-ledger migrations by database name
        run: npx wrangler d1 migrations apply dstationery-deletion-ledger-production --remote --env production
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env production
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
        working-directory: web
      - run: npm run build:connected
        working-directory: web
      - run: npm ci
        working-directory: cloud-web
      - run: npx wrangler deploy --env production
        working-directory: cloud-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
