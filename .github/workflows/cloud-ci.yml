name: Cloud Connected

on:
  push:
    branches: [main]
    paths: ["cloud/**", "cloud-web/**", "cloud-protocol-test-vectors/**", "web/**", "shared/**", "docs/dst1-schema.json", "protocol-test-vectors/**", "scripts/ci/verification-reuse*", "scripts/ci/capture-production-recovery*", "scripts/ci/*web-artifact.mjs", ".github/workflows/cloud-ci.yml", ".github/workflows/dom-web-pages.yml"]
  pull_request:
    branches: [main]
    paths: ["cloud/**", "cloud-web/**", "cloud-protocol-test-vectors/**", "web/**", "shared/**", "docs/dst1-schema.json", "protocol-test-vectors/**", "scripts/ci/verification-reuse*", "scripts/ci/capture-production-recovery*", "scripts/ci/*web-artifact.mjs", ".github/workflows/cloud-ci.yml", ".github/workflows/dom-web-pages.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: verify
        options: [verify, production]
      production_confirmation:
        description: Type DEPLOY_PRODUCTION only after verification evidence is approved
        type: string
        required: false
      release_commit:
        description: Full commit SHA approved by verification evidence for production
        type: string
        required: false
      recovery_public_key:
        description: Base64 DER RSA public key for encrypted recovery evidence (private key stays local)
        type: string
        required: false
      full_regression:
        description: Run old regressions to diagnose a production screenshot/manual failure
        type: boolean
        default: false
      diagnostic_reason:
        description: Production screenshot or manual acceptance failure being investigated
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
      run_id: ${{ steps.evidence.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: evidence
        run: node scripts/ci/verification-reuse.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_commit || github.sha }}
          DEPLOY_TARGET: ${{ inputs.target }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          FULL_REGRESSION: ${{ inputs.full_regression }}
          DIAGNOSTIC_REASON: ${{ inputs.diagnostic_reason }}

  verify:
    needs: gate
    if: needs.gate.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloud/package-lock.json
            cloud-web/package-lock.json
            web/package-lock.json
      - name: Verify encrypted recovery evidence handling
        run: node --test scripts/ci/capture-production-recovery.test.mjs
      - run: npm ci
        working-directory: cloud
      - name: Verify production environment configuration
        run: node scripts/guard-environment.mjs production
        working-directory: cloud
      - run: npm run typecheck
        working-directory: cloud
      - name: Verify active Cloud regressions
        if: inputs.full_regression != true
        run: npm run test:minimum
        working-directory: cloud
      - name: Diagnose all Cloud regressions
        if: inputs.full_regression == true
        run: npm test
        working-directory: cloud
      - if: inputs.full_regression == true
        run: npm run migrate:local
        working-directory: cloud
      - name: Exercise the local HTTP sync contract
        if: inputs.full_regression == true
        working-directory: cloud
        shell: bash
        run: |
          npm run dev -- \
            --var AUTH_PEPPER:ci-local-smoke-pepper \
            --var ADMIN_EMAIL:admin@example.com \
            --var RESEND_API_KEY:unused-in-local-mode \
            > "$RUNNER_TEMP/dstationery-cloud.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8787/health >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/dstationery-cloud.log"
              exit 1
            fi
            sleep 1
          done
          npm run smoke:local
      - run: npm ci
        working-directory: cloud-web
      - run: npm run typecheck
        working-directory: cloud-web
      - if: inputs.full_regression == true
        run: npm test
        working-directory: cloud-web
      - run: npm ci
        working-directory: web
      - if: inputs.full_regression != true
        run: npm run test:minimum
        working-directory: web
      - if: inputs.full_regression == true
        run: npm test
        working-directory: web
      - run: npm run build:all
        working-directory: web
      - name: Install Chromium for connected page verification
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify connected page startup under production CSP
        run: npm run test:connected-smoke
        working-directory: web
      - name: Stamp verified Web builds
        run: node scripts/ci/stamp-web-artifact.mjs
        env:
          FULL_REGRESSION: ${{ inputs.full_regression }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-verification-${{ github.sha }}
          path: |
            web/dist-offline/
            web/dist-connected/
            web/verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-reports-${{ github.sha }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  deploy-production:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.target == 'production' && needs.gate.result == 'success' && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.gate.outputs.reuse == 'true'))
    needs: [gate, verify]
    runs-on: ubuntu-24.04
    environment: cloud-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloud/package-lock.json }
      - run: npm ci
        working-directory: cloud
      - name: Require approved commit and explicit production confirmation
        if: inputs.production_confirmation != 'DEPLOY_PRODUCTION' || inputs.release_commit != github.sha
        run: |
          echo 'Production requires DEPLOY_PRODUCTION and the full approved verified commit SHA.' >&2
          exit 1
      - run: node scripts/guard-environment.mjs production
        working-directory: cloud
      - name: Verify protected production bindings
        working-directory: cloud
        run: |
          secret_names="$(npx wrangler secret list --env production | jq -r '.[].name')"
          for required in AUTH_PEPPER ADMIN_EMAIL RESEND_API_KEY ALLOWED_ORIGIN ACCESS_TEAM_DOMAIN ACCESS_AUD; do
            grep -qx "$required" <<< "$secret_names"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production Access bindings
        working-directory: cloud-web
        run: |
          npm ci
          secret_names="$(npx wrangler secret list --env production | jq -r '.[].name')"
          for required in ACCESS_TEAM_DOMAIN ACCESS_AUD MANAGEMENT_ADMIN_EMAIL; do
            grep -qx "$required" <<< "$secret_names"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: cloud-verification-${{ github.sha }}
          path: web
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.run_id || github.run_id }}
      - run: node scripts/ci/check-web-artifact.mjs
        env:
          RELEASE_SHA: ${{ github.sha }}
      - name: Require current main before production mutation
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ github.sha }}
      - name: Capture encrypted production recovery evidence
        run: node scripts/ci/capture-production-recovery.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECOVERY_PUBLIC_KEY: ${{ inputs.recovery_public_key }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-recovery-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-recovery.enc.json
          if-no-files-found: error
          retention-days: 14
      - name: Apply production migrations by database name
        run: npx wrangler d1 migrations apply dstationery-production --remote --env production
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply production deletion-ledger migrations by database name
        run: npx wrangler d1 migrations apply dstationery-deletion-ledger-production --remote --env production
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env production
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env production
        working-directory: cloud-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production Access interception
        run: node cloud-web/scripts/verify-access.mjs prod.rochelimit.me
